name: Build Variants
on:
  workflow_call:
    inputs:
      create-release:
        description: Upload dist artifacts to a GitHub release
        type: boolean
        default: false
      tag_name:
        description: Release tag name (required when create-release is true)
        type: string
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x86
            is-linux: false
          - os: windows-latest
            architecture: x64
            is-linux: false
          - os: ubuntu-latest
            architecture: x64
            is-linux: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up NASM
      if: ${{ matrix.architecture == 'x86' && ! matrix.is-linux }}
      uses: ilammy/setup-nasm@v1.5.1
    - name: Setup scoop
      if: ${{ matrix.architecture == 'x86' && ! matrix.is-linux }}
      uses: MinoruSekine/setup-scoop@v3
    - name: Install patch
      if: ${{ matrix.architecture == 'x86' && ! matrix.is-linux }}
      run: scoop install patch

    - name: Setup Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version-file: '.nvmrc'
    - name: Setup Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version-file: '.python-version'
        architecture: ${{ matrix.architecture }}
    - name: Install npm modules
      run: npm ci
    - name: Install pip modules
      run: npm run pipsetup

    - name: Build release artifact ${{ matrix.architecture }}
      if: ${{ ! matrix.is-linux }}
      run: npm run distpackage-${{ matrix.architecture }}
    - name: Build release artifact linux
      if: ${{ matrix.is-linux }}
      run: npm run distpackagelinux-${{ matrix.architecture }}

    - name: Create release
      if: ${{ inputs.create-release }}
      uses: softprops/action-gh-release@v2.0.4
      with:
        token: ${{ github.token }}
        tag_name: ${{ inputs.tag_name }}
        make_latest: true
        generate_release_notes: true
        files: dist/*
